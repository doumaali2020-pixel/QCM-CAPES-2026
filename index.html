<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QCM CAPES Mathématiques</title>
<link rel="stylesheet" href="style.css">
<script>
window.MathJax={tex:{inlineMath:[['\\(','\\)'],['$','$']],displayMath:[['\\[','\\]']]},svg:{fontCache:'global'}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body class="before-start">
<header class="topbar">
  <div class="header-inner">
    <div class="title-wrap">
      <h1 id="mainTitle">QCM CAPES Mathématiques</h1>
      <div id="subtitle" class="subtitle">Choisissez le CAPES que vous voulez jouer</div>
    </div>
    <div class="progress-wrap">
      <div id="progressText" class="progress-text"></div>
      <div class="progress"><div id="progressBar"></div></div>
    </div>
  </div>
</header>

<section id="selectionBox" class="selection-box">
  <h2>Choisir le QCM</h2>
  <div class="exam-grid">
    <button class="exam-card" data-year="2017">
      <span class="exam-year">CAPES 2017</span>
      <span>55 questions disponibles</span>
    </button>
    <button class="exam-card" data-year="2026">
      <span class="exam-year">CAPES 2026</span>
      <span>60 questions</span>
    </button>
  </div>
</section>

<section id="identityBox" class="identity-box" hidden>
  <h2 id="identityTitle">Identification du professeur</h2>
  <div class="chosen-exam" id="chosenExam"></div>
  <div class="identity-grid">
    <label>Nom du professeur
      <input id="teacherName" type="text" placeholder="Votre nom et prénom" autocomplete="name">
    </label>
    <label>Votre Gmail
      <input id="teacherEmail" type="email" placeholder="exemple@gmail.com" autocomplete="email">
    </label>
  </div>
  <p class="required-note">Nom et Gmail du professeur obligatoires pour commencer le QCM.</p>
  <div id="identityError" class="identity-error"></div>
  <div class="identity-actions">
    <button id="backChoiceBtn" class="secondary-btn">Changer le CAPES</button>
    <button id="startQuizBtn" class="start-quiz-btn">Commencer le QCM</button>
  </div>
</section>

<main id="quizMain" hidden>
<section class="page">
  <div id="qNum" class="qnum"></div>
  <div id="qText" class="question"></div>
  <div id="choices" class="choices"></div>
  <div id="feedback" class="feedback"></div>
  <div id="correction" class="correction"></div>
  <div class="actions">
    <button id="prevBtn">Question précédente</button>
    <div id="score" class="score"></div>
    <button id="finishBtn" class="finish-btn">Je termine</button>
    <button id="nextBtn">Question suivante</button>
  </div>
</section>
</main>

<div id="finishOverlay" class="finish-overlay" hidden>
  <div class="finish-card"><h2>Envoi du résultat…</h2><p>Veuillez patienter.</p></div>
</div>

<script src="script.js"></script>
</body>
</html>
